version: "3.9"

# Development compose — hot-reload for both backend and frontend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/app:/app/app
      - newsrobot-data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DATABASE_URL: sqlite:////data/newsrobot.db
      PORT: "8000"
      LOG_LEVEL: info
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:5173"
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-claude-haiku-4-5-20251001}"
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: ""
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  newsrobot-data:
